<html>
    <head>
        <title>Albums</title>
    </head>
    <body>
        <h1>My Album Ratings</h1>
        <ul>
            {% for album in albums %}
            <li> <a href="/album/{{ album.title.lower().replace(' ', '-') }}" >
                {{ album.title }}
            </a> 
            - {{ album.artist }} ({{ album.rating }}/10) 

            </li>
            {% endfor %}
        </ul>
        <button onclick="window.location.href='/'">Back To home</button>
    </body>
</html>
