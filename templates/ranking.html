<html>
<head>
    <title>{{ spotify.name }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: linear-gradient(
                135deg,
                var(--album-color),
                #111111
            );

            color: white;
        }

        .review-page {
            width: 1250px;
            max-width: 90%;
            margin: 60px auto;

            display: flex;
            align-items: flex-start;
            gap: 100px;
        }

        .album-info {
            width: 500px;
            flex-shrink: 0;
            text-align: center;
        }

        .review-album-art {
            width: 500px;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .album-info h1 {
            margin-bottom: 8px;
        }

        .album-info h2 {
            margin-bottom: 12px;
        }

        .user-review {
            width: 450px;
            min-height: 300px;

            margin-top: 0;
            padding: 30px;

            background: rgba(0, 0, 0, 0.65);
            border-radius: 20px;

            text-align: left;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .user-review h2 {
            margin-bottom: 15px;
        }

        .review-stars {
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .review-text {
            font-size: 1.1rem;
            line-height: 1.6;

            overflow-wrap: break-word;
            word-break: normal;
            white-space: normal;

            margin-bottom: 25px;
        }

        .no-review {
            color: #888;
            font-style: italic;
            margin-bottom: 25px;
        }

        .album-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .spotify-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;

            background-color: #1db954;
            color: black;

            text-decoration: none;
            border-radius: 25px;

            font-weight: bold;
            transition: 0.2s;
        }

        .spotify-button:hover {
            background-color: #1ed760;
            transform: scale(1.05);
        }

        @media (max-width: 800px) {
            .review-page {
                flex-direction: column;
                gap: 40px;
            }

            .album-info,
            .user-review {
                width: 100%;
                max-width: 400px;
            }

            .review-album-art {
                width: 100%;
                height: auto;
            }
        }
    </style>

</head>

<body style="--album-color: {{ color }};">

    <nav>
        <a href="/" class="logo">
            <span class="sound">sound</span><span class="scape">SCAPE</span>
        </a>

        <div class="nav-links">
            <a href="/all_rankings">Ratings</a>
            <a href="/search">Search</a>
        </div>
    </nav>


    <div class="review-page">

        <!-- LEFT SIDE: ALBUM INFORMATION -->

        <div class="album-info">

            <img
                src="{{ spotify.art }}"
                class="review-album-art"
            >

            <h1>{{ spotify.name }}</h1>

            <h2>{{ spotify.artist }}</h2>

            <p>Released: {{ spotify.release_date }}</p>

            <a
                href="{{ spotify.url }}"
                target="_blank"
                class="spotify-button"
            >
                Open in Spotify
            </a>

        </div>


        <!-- RIGHT SIDE: USER REVIEW -->

        <div class="user-review">

            <h2>Your Review:</h2>

            <div class="review-stars">
                {{ star_rating(reviews[0][0]) }}
            </div>


            {% if reviews[0][1] %}

                <p class="review-text">
                    {{ reviews[0][1] }}
                </p>

            {% else %}

                <p class="no-review">
                    No written review.
                </p>

            {% endif %}


            <div class="album-actions">

                <a
                    href="{{ url_for('edit_review', album_id=spotify.id) }}"
                    class="edit-button"
                >
                    Edit Review
                </a>

                <a
                    href="{{ url_for('delete_review', album_id=spotify.id) }}"
                    class="delete-button"
                    onclick="return confirm('Are you sure you want to delete this review?');"
                >
                    Delete Review
                </a>

            </div>

        </div>

    </div>

</body>
</html>
