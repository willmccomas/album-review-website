<html>
    <head>
        <title>Search Results</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <style>
            body {
                text-align: center;
            }

            .album-search-card {
                display: flex;
                align-items: center;
                gap: 25px;
                width: 600px;
                margin: 25px auto;
                padding: 20px;
                border-radius: 15px;
                background-size: cover;
                background-position: center;

                color: white;
                position: relative;
                overflow: hidden;
            }

            .album-search-card img {
                border-radius: 8px;
            }

            .album-search-card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.65);
            }

            .album-search-card > * {
                position: relative;
                z-index: 1;
            }

            .album-info {
                text-align: left;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .album-info button {
                font-family: 'Inter', sans-serif;
                color: white;
                border: none;
                cursor: pointer;
                text-decoration: none;
                background-color: #333;
                padding: 10px 15px;
                border-radius: 8px;
            }

            .album-info button:hover {
                background-color: #555;
            }

        </style>
    </head>

    <body>
        <nav>
            <a href="/" class="logo">
                <span class="sound">sound</span><span class="scape">SCAPE</span>
            </a>

            <div class="nav-links">
                <a href="/all_rankings">Ratings</a>
                <a href="/search">Search</a>
            </div>
        </nav>

        <div class="page-container">

            <h1>Search Results</h1>

            <p>
                Showing results for:
                {{ request.args.get("query")}}
            </p>

            {% for album in albums %}

            <div class="album-search-card" style="background-image: url('{{ album.art }}');">

                <img src="{{ album.art }}" width="200">

                <div class="album-info">
                    <h2>{{ album.name }}</h2>

                    <p>{{ album.artist }}</p>

                    <p>Release Date: {{ album.release_date }}</p>

                    <a href="/album/{{ album.id }}">
                        <button>Rate this album</button>
                    </a>
                </div>
            </div>

            {% endfor %}
        </div>

    </body>
</html>
