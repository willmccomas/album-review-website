<html>
    <head>
        <title>Search Results</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
            }

            .album-card {
                display: flex;
                align-items: center;
                gap: 25px;
                width: 600px;
                margin: 25px auto;
                padding: 20px;
                border-radius: 15px;
                background-size: cover;
                background-position: center;

                color: white;
                position: relative;
                overflow: hidden;
            }

            .album-card img {
                border-radius: 8px;
            }

            .album-card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.65);
            }

            .album-card > * {
                position: relative;
                z-index: 1;
            }

            .album-info {
                text-align: left;
            }

            .album-info a {
                color: white;
                text-decoration: none;
                background-color: #333;
                padding: 10px 15px;
                border-radius: 8px;
            }

            .album-info a:hover {
                background-color: #555;
            }

        </style>
    </head>

    <body>
        <h1>Search Results</h1>

        <p>
            Showing results for:
            {{ request.args.get("query")}}
        </p>

        <a href="{{ url_for('search') }}">
            <button>Back to Search</button>
        </a>

        {% for album in albums %}

        <div class="album-card" style="background-image: url('{{ album.art }}');">

            <img src="{{ album.art }}" width="200">

            <div class="album-info">
                <h2>{{ album.name }}</h2>

                <p>{{ album.artist }}</p>

                <p>Release Date: {{ album.release_date }}</p>

                <a href="/album/{{ album.id }}">
                    <button>Rank this album</button>
                </a>
            </div>
        </div>

        {% endfor %}

    </body>
</html>
