<html>
<head>
    <title>{{ spotify.name }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: linear-gradient(
                135deg,
                var(--album-color),
                #111111
            );
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        .review-card {
            background: rgba(0, 0, 0, 0.65);
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            margin: 50px auto;
        }

        img {
            border-radius: 10px;
        }

        h1, h2, p {
            text-shadow: 2px 2px 8px black;
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
    </style>

</head>

<body style="--album-color: {{ color }};">
    <nav>
        <a href="/" class="logo">
            <span class="sound">sound</span><span class="scape">SCAPE</span>
        </a>

        <div class="nav-links">
            <a href="/all_rankings">Ratings</a>
            <a href="/search">Search</a>
        </div>
    </nav>

    <div class="page-container">

        <div class="review-card">

            <h1>{{ spotify.name }}</h1>

            <h2>{{ spotify.artist }}</h2>

            <img src="{{ spotify.art }}" width="300">

            <p>Released: {{ spotify.release_date }}</p>

            <p>Total Tracks: {{ spotify.total_tracks }}</p>

            <a href="{{ spotify.url }}" target="_blank">
                <button>Open on Spotify</button>
            </a>

            <hr>

            <h2>Rate This Album</h2>


            <form method="POST">
                <label>Rating (out of 5):</label>
                <br>
                <input
                    type="number"
                    name="rating"
                    min="0.5"
                    max="5"
                    step="0.5"
                    required
                >

                <br><br>

                <label>Review:</label>
                <br>

                <textarea
                    name="review"
                    rows="5"
                    cols="40"
                    placeholder="Write your review here..."
                ></textarea>

                <br><br>

                <button type="submit">Save Review</button>

            </form>

        </div>

    </div>

</body>
</html>
